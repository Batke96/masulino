<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Where Masulino data sits and how API calls move it</title>
  <desc id="desc">The browser and the website server call one API on Vercel. The records sit in Neon. Vercel does not store them. A timer call is not turned on. Table changes are run by hand.</desc>
  <rect width="1200" height="820" fill="#ffffff"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="40" y="42" fill="#1e2744" font-size="26" font-weight="650">Where the data sits</text>
    <text x="40" y="70" fill="#5c6578" font-size="15">The records live in one database. Callers reach them only through the API.</text>

    <!-- Callers -->
    <rect x="40" y="98" width="350" height="176" rx="16" fill="#ffffff" stroke="#1e2744" stroke-width="1.5"/>
    <text x="60" y="130" fill="#1e2744" font-size="18" font-weight="650">Staff browser</text>
    <text x="60" y="160" fill="#3d4455" font-size="15">The app runs here.</text>
    <text x="60" y="184" fill="#3d4455" font-size="15">It does not keep the records.</text>
    <text x="60" y="216" fill="#1e2744" font-size="15" font-weight="650">API call: /api</text>
    <text x="60" y="240" fill="#5c6578" font-size="14">Sends the login cookie.</text>

    <rect x="425" y="98" width="350" height="176" rx="16" fill="#ffffff" stroke="#1e2744" stroke-width="1.5"/>
    <text x="445" y="130" fill="#1e2744" font-size="18" font-weight="650">Website server</text>
    <text x="445" y="160" fill="#3d4455" font-size="15">Not part of this project.</text>
    <text x="445" y="184" fill="#3d4455" font-size="15">The web page does not call the API.</text>
    <text x="445" y="216" fill="#1e2744" font-size="15" font-weight="650">API call: /api/public/birthdays</text>
    <text x="445" y="240" fill="#5c6578" font-size="14">Sends a secret key.</text>

    <rect x="810" y="98" width="350" height="176" rx="16" fill="#fafbfc" stroke="#8b93a7" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="830" y="130" fill="#1e2744" font-size="18" font-weight="650">Timer</text>
    <text x="830" y="160" fill="#3d4455" font-size="15">Not turned on.</text>
    <text x="830" y="184" fill="#3d4455" font-size="15">No call is made today.</text>
    <text x="830" y="216" fill="#1e2744" font-size="15" font-weight="650">Would call: /api/cron/outbox</text>
    <text x="830" y="240" fill="#5c6578" font-size="14">Would send another secret.</text>

    <line x1="215" y1="274" x2="215" y2="318" stroke="#e36a45" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="600" y1="274" x2="600" y2="318" stroke="#e36a45" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="985" y1="274" x2="985" y2="318" stroke="#8b93a7" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>

    <!-- API -->
    <rect x="40" y="330" width="1120" height="132" rx="16" fill="#1e2744"/>
    <text x="64" y="368" fill="#ffffff" font-size="18" font-weight="650">The API — Vercel, Frankfurt</text>
    <text x="64" y="398" fill="#f4f6fb" font-size="15">Every call above lands here. This is the only program that opens the database.</text>
    <text x="64" y="426" fill="#f4f6fb" font-size="15">Vercel keeps the keys and the database address. It does not keep the records.</text>

    <line x1="600" y1="462" x2="600" y2="508" stroke="#1e2744" stroke-width="2" marker-end="url(#arrow-navy)"/>
    <text x="616" y="490" fill="#5c6578" font-size="14">Database connection. Not a web call.</text>

    <!-- Database -->
    <text x="40" y="540" fill="#1e2744" font-size="18" font-weight="650">Neon — EU</text>
    <text x="168" y="540" fill="#5c6578" font-size="15">This is where the data sits. One database. Three logins.</text>

    <rect x="40" y="560" width="350" height="148" rx="16" fill="#ffffff" stroke="#1e2744" stroke-width="1.5"/>
    <text x="60" y="594" fill="#1e2744" font-size="17" font-weight="650">Login data</text>
    <text x="60" y="624" fill="#3d4455" font-size="15">Who can sign in,</text>
    <text x="60" y="646" fill="#3d4455" font-size="15">and the current session.</text>
    <text x="60" y="678" fill="#5c6578" font-size="14">Login name: masulino_auth</text>

    <rect x="425" y="560" width="350" height="148" rx="16" fill="#ffffff" stroke="#1e2744" stroke-width="1.5"/>
    <text x="445" y="594" fill="#1e2744" font-size="17" font-weight="650">Business data</text>
    <text x="445" y="624" fill="#3d4455" font-size="15">The records the API</text>
    <text x="445" y="646" fill="#3d4455" font-size="15">reads and writes.</text>
    <text x="445" y="678" fill="#5c6578" font-size="14">Login name: masulino_app</text>

    <rect x="810" y="560" width="350" height="148" rx="16" fill="#ffffff" stroke="#1e2744" stroke-width="1.5"/>
    <text x="830" y="594" fill="#1e2744" font-size="17" font-weight="650">Waiting jobs</text>
    <text x="830" y="624" fill="#3d4455" font-size="15">Saved to do later.</text>
    <text x="830" y="646" fill="#3d4455" font-size="15">Nothing is sent on from here.</text>
    <text x="830" y="678" fill="#5c6578" font-size="14">Login name: masulino_worker</text>

    <text x="40" y="748" fill="#5c6578" font-size="14">Table changes are run by hand from a laptop. The live API cannot run them.</text>
    <text x="40" y="772" fill="#5c6578" font-size="14">On a laptop, the same API uses a local database instead of Neon. A solid arrow is a call that exists. A dashed arrow is not turned on.</text>
  </g>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#e36a45"/>
    </marker>
    <marker id="arrow-gray" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8b93a7"/>
    </marker>
    <marker id="arrow-navy" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1e2744"/>
    </marker>
  </defs>
</svg>
